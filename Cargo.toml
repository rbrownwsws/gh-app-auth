[package]
name = "gh-app-auth"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = {version = "1.0", features = ["derive"] }
